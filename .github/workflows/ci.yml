name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bench:browser:build
      - run: npm run build:redirect
      # Search baseline: keep the per-suite retrieval floors visible in CI alongside the mixed-library diagnostic.
      - name: Retrieval baseline
        run: npm run bench:retrieval
      # Search in a larger library, without a model (docs/p0-research-quality.md, item 4): each
      # real-document suite inside one library of every suite's documents, and the field suite also
      # with generated ones, at 3 (the app's), 5 and 10 results. Written to the job summary as one
      # table per limit. Diagnostic only: the retrieval floors in npm test decide, and a change to the
      # result limit needs model runs (CONTRIBUTING.md).
      - name: Search in a larger library (diagnostic)
        shell: bash
        run: |
          {
            npm run -s bench:retrieval:scale
            echo
            npm run -s bench:retrieval:scale -- --limit 5
            echo
            npm run -s bench:retrieval:scale -- --limit 10
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # False reassurance for every suite on this change's label rules, from the recorded runs
      # (docs/p0-research-quality.md). A diagnostic, like the table above: no model is run.
      - name: False reassurance on recorded answers
        shell: bash
        run: npm run -s bench:baseline | tee -a "$GITHUB_STEP_SUMMARY"

  # A release must rebuild byte for byte from its tag (docs/releases.md). Build the
  # commit twice, in different directories and time zones, and compare every file.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: first
      - uses: actions/checkout@v4
        with:
          path: second
      - uses: actions/setup-node@v4
        with:
          node-version-file: first/.nvmrc
          cache: npm
          cache-dependency-path: first/package-lock.json
      - name: Build twice and compare
        env:
          KOVRUNE_BUILD: release
        run: |
          (cd first && npm ci && npm run build && npm run checksums)
          (cd second && npm ci && TZ=Pacific/Kiritimati npm run build)
          cd second && npm run checksums -- --check ../first/dist/SHA256SUMS
